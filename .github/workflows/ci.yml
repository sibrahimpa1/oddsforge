name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv -p 3.12 && uv pip install -e ".[dev]"
      - name: Lint
        run: uv run --no-sync ruff check oddsforge tests
      - name: Unit tests (odds maths, settlement, models, paper betting)
        run: uv run --no-sync pytest -q
      - name: ETL smoke test on the bundled data (no network, no keys)
        env:
          ODDSFORGE_OFFLINE: "1"
          ODDSFORGE_DATA_DIR: ${{ github.workspace }}/data
        run: |
          uv run --no-sync oddsforge load
          uv run --no-sync python -c "from oddsforge.db import session, Match; from sqlalchemy import select, func; s=session(); n=s.scalar(select(func.count()).select_from(Match)); print(n, 'matches'); assert n > 10000"

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run build
