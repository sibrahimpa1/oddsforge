[project]
name = "oddsforge"
version = "0.1.0"
description = "Pregame MLS prediction system: xG-based team ratings, Dixon-Coles score model, market layer, timestamp-honest backtests and fake-money paper betting."
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Senka Ibrahimpašić", email = "sibrahimpa1@gmail.com" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "numpy>=1.26",
  "pandas>=2.2",
  "scipy>=1.13",
  "scikit-learn>=1.5",
  "lightgbm>=4.3",
  "httpx>=0.27",
  "python-dotenv>=1.0",
  "anthropic>=0.40",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
postgres = ["psycopg[binary]>=3.2"]

[project.scripts]
oddsforge = "oddsforge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["oddsforge*"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
